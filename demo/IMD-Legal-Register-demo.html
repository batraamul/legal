/* js/store.js */
/* js/store.js — the register lives on the server as one JSON file.
   This file loads it, saves every change (merging when two people save at once),
   checks every 20 seconds for changes made by others, and handles upload / download. */
(function () {
  'use strict';
  const LR = window.LR, U = LR.util;
  const S = LR.store = { data: null, rev: 0, dirty: false, saving: false, status: 'ok', savedAt: 0, savedBy: '', online: true };
  const COLLS = ['cases', 'matters', 'notices', 'rti', 'counsel', 'fees', 'courts', 'refs', 'tasks'];
  let timer = null, poller = null, sentJson = '';

  S.me = () => { try { return localStorage.getItem('imdlr-name') || 'legal'; } catch (_) { return 'legal'; } };

  async function api(path, opt = {}) {
    if (LR.demoApi) return LR.demoApi(path, opt);
    const r = await fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, opt));
    if (r.status === 401) { S.loggedOut(); throw new Error('Please log in again.'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('The server answered ' + r.status));
    return j;
  }
  S.api = api;

  S.migrate = (d) => {
    d = d || {};
    d.app = 'IMD-Legal-Register'; d.format = 1;
    d.meta = d.meta || {};
    for (const c of COLLS) if (!Array.isArray(d[c])) d[c] = [];
    d.settings = Object.assign(LR.sample.settings(), d.settings || {});
    d.settings.alerts = Object.assign(LR.sample.settings().alerts, d.settings.alerts || {});
    d.actionState = d.actionState || {};
    d.audit = d.audit || [];
    d.deleted = d.deleted || {};
    if (!Array.isArray(d.settings.regions) || !d.settings.regions.length) d.settings.regions = LR.refs.REGIONS.slice();
    for (const c of d.cases) {
      for (const k of ['hearings', 'orders', 'docs', 'letters']) if (!Array.isArray(c[k])) c[k] = [];
    }
    for (const m of d.matters) if (!Array.isArray(m.history)) m.history = [];
    // The Legal Section does not run an RTI register: earlier RTI entries become "RTI — legal opinion" matters.
    if (d.rti.length) {
      for (const r of d.rti) {
        if (d.matters.some((m) => m.id === 'mt-' + r.id)) continue;
        d.matters.push({ id: 'mt-' + r.id, type: 'RTI — legal opinion', ref: r.regNo || '', receivedOn: r.receivedOn || '', dueOn: '', fromOffice: r.cpio || '',
          subject: (r.applicant ? r.applicant + ' — ' : '') + (r.subject || ''), status: r.status === 'Closed' ? 'Closed' : 'Opinion given / vetted', notes: r.notes || '', history: [], sample: r.sample, updatedAt: Date.now() });
        d.deleted[r.id] = Date.now();
      }
      d.rti = [];
      S.migrated = true;
    }
    return d;
  };

  S.init = async () => {
    const j = await api('/api/data');
    S.rev = j.meta.rev; S.savedAt = j.meta.savedAt; S.savedBy = j.meta.savedBy;
    S.data = S.migrate(j.data);
    if (j.meta.fresh || (!S.data.cases.length && !S.data.courts.length && !S.data.meta.seeded)) {
      LR.sample.seed(S.data);
      S.commit('Started the register with the court list and example entries');
    }
    if (S.migrated) { S.migrated = false; S.commit('Moved earlier RTI entries to Opinions & vetting', { silent: true }); }
    // Changes that could not reach the server last time (server was down) are merged back in.
    try {
      const left = localStorage.getItem('imdlr-unsaved');
      if (left) {
        S.data = S.migrate(LR.merge.mergeData(S.data, JSON.parse(left)));
        localStorage.removeItem('imdlr-unsaved');
        S.recovered = true;
        S.commit('Sent changes that had not reached the server earlier', { silent: true });
      }
    } catch (_) {}
    poller = setInterval(S.poll, 20000);
    window.addEventListener('online', () => { if (S.dirty) S.save(); });
  };

  S.touch = (o) => { o.updatedAt = Date.now(); return o; };
  S.audit = (what) => {
    S.data.audit.unshift({ id: U.uid('au'), at: Date.now(), by: S.me(), what: String(what).slice(0, 200) });
    if (S.data.audit.length > 600) S.data.audit.length = 600;
  };

  /** After changing S.data: commit('what was done') saves it and redraws the screen. */
  S.commit = (what, opts = {}) => {
    S.data.meta.updatedAt = Date.now();
    if (what) S.audit(what);
    S.dirty = true;
    S.setStatus('busy');
    clearTimeout(timer);
    timer = setTimeout(S.save, opts.now ? 10 : 900);
    if (!opts.silent && LR.app) LR.app.render();
  };

  S.upsert = (coll, item, what) => {
    S.touch(item);
    const list = S.data[coll];
    const i = list.findIndex((x) => x.id === item.id);
    if (i >= 0) list[i] = item; else list.push(item);
    delete S.data.deleted[item.id];
    S.commit(what);
    return item;
  };
  S.remove = (coll, id, what) => {
    const list = S.data[coll];
    const i = list.findIndex((x) => x.id === id);
    if (i < 0) return;
    const [gone] = list.splice(i, 1);
    S.data.deleted[id] = Date.now();
    S.commit(what);
    LR.ui.toast((what || 'Deleted') + '.', '', { label: 'Undo', fn: () => { S.data[coll].push(S.touch(gone)); delete S.data.deleted[id]; S.commit('Undid: ' + (what || 'delete')); } });
  };
  S.get = (coll, id) => (S.data[coll] || []).find((x) => x.id === id) || null;

  S.save = async () => {
    if (!S.dirty) return true;
    if (S.saving) { S.again = true; return false; }
    S.saving = true; S.again = false;
    sentJson = JSON.stringify(S.data);
    const sentAt = S.data.meta.updatedAt;
    try {
      const j = await api('/api/data', { method: 'PUT', body: JSON.stringify({ baseRev: S.rev, data: S.data, by: S.me(), mode: 'save' }) });
      S.rev = j.meta.rev; S.savedAt = j.meta.savedAt; S.savedBy = j.meta.savedBy;
      const changedMeanwhile = S.data.meta.updatedAt !== sentAt;
      if (j.merged && j.data) {
        S.data = S.migrate(changedMeanwhile ? LR.merge.mergeData(j.data, S.data) : j.data);
        if (LR.app) LR.app.render();
      }
      S.dirty = changedMeanwhile || !!(j.merged && changedMeanwhile);
      S.online = true;
      S.setStatus(S.dirty ? 'busy' : 'ok');
      try { localStorage.removeItem('imdlr-unsaved'); } catch (_) {}
    } catch (err) {
      S.online = false;
      S.setStatus('err', err.message);
      try { localStorage.setItem('imdlr-unsaved', sentJson); } catch (_) {}
      clearTimeout(timer); timer = setTimeout(S.save, 10000);
    } finally {
      S.saving = false;
      if (S.dirty && (S.again || S.online)) { clearTimeout(timer); timer = setTimeout(S.save, 300); }
    }
    return !S.dirty;
  };
  S.flush = async () => { clearTimeout(timer); for (let i = 0; i < 4 && S.dirty; i++) { if (S.saving) await new Promise((r) => setTimeout(r, 300)); else await S.save(); } return !S.dirty; };

  S.poll = async () => {
    if (S.saving || document.hidden) return;
    try {
      const m = await api('/api/meta');
      S.online = true;
      if (m.rev !== S.rev) {
        if (S.dirty) return S.save();                 // our save will merge
        const j = await api('/api/data');
        S.rev = j.meta.rev; S.savedAt = j.meta.savedAt; S.savedBy = j.meta.savedBy;
        S.data = S.migrate(j.data);
        if (LR.app) LR.app.render();
        if (m.savedBy && m.savedBy !== S.me()) LR.ui.toast('Brought in the changes saved by ' + m.savedBy + '.');
      }
      if (S.status === 'err' && !S.dirty) S.setStatus('ok');
    } catch (err) { S.online = false; S.setStatus('err', err.message); }
  };

  S.setStatus = (st, msg) => {
    S.status = st; S.statusMsg = msg || '';
    const el = document.getElementById('sync');
    if (!el) return;
    el.className = 'sync' + (st === 'busy' ? ' busy' : st === 'err' ? ' err' : '');
    el.querySelector('span').textContent = st === 'busy' ? 'Saving…' : st === 'err' ? 'Not saved — server unreachable' : (LR.demo ? 'Demo — saved in this browser' : 'Saved on server');
    el.title = st === 'err' ? (msg || '') + ' — changes are kept and sent when the server is back.' : 'Revision ' + S.rev + (S.savedBy ? ' · last saved by ' + S.savedBy : '') + (S.savedAt ? ' · ' + U.fmtTime(S.savedAt) : '');
  };

  /* -------- download / upload -------- */
  S.fileName = () => (S.data.settings.filePrefix || 'IMD-Legal-Register') + '-' + U.stamp() + '.json';
  S.download = (quiet) => {
    const name = S.fileName();
    if (LR.demo) { if (!quiet) LR.ui.toast('Demo: downloads are switched off here. On the server this saves ' + name + '.'); return name; }
    U.download(name, JSON.stringify(S.data, null, 1));
    if (!quiet) LR.ui.toast('Downloaded ' + name);
    return name;
  };

  S.upload = async () => {
    const f = await U.pickFile('.json,application/json');
    if (!f) return;
    let incoming;
    try { incoming = LR.merge.validate(JSON.parse(await U.readText(f))); }
    catch (err) { LR.ui.toast('This file cannot be used: ' + err.message, 'err'); return; }
    const im = incoming.meta || {};
    const msg = '<p style="margin:0 0 10px"><b>' + U.esc(f.name) + '</b><br><span class="muted small">' +
      U.plural(incoming.cases.length, 'case') + ', ' + U.plural((incoming.notices || []).length, 'notice') + ', ' + U.plural((incoming.matters || []).length, 'advisory matter') +
      (im.savedAt ? ' · saved ' + U.fmtTime(im.savedAt) + (im.savedBy ? ' by ' + U.esc(im.savedBy) : '') : '') + '</span></p>' +
      '<p style="margin:0 0 10px">The register on the server now has ' + U.plural(S.data.cases.length, 'case') + (S.savedAt ? ' (last saved ' + U.fmtTime(S.savedAt) + ')' : '') + '.</p>' +
      '<p style="margin:0;font-weight:600">Do you want to override the existing data?</p>';
    const v = await LR.ui.choose(msg, [
      { v: 'merge', label: 'No — merge, keep both' },
      { v: 'replace', label: 'Yes, override existing data', cls: 'pri' },
    ], { title: 'Upload a register file', width: 560,
      detail: '<b>Override</b> replaces everything on the server with this file. <b>Merge</b> adds what is new in the file and keeps the newer copy of anything changed in both. Either way the server first keeps a backup of the present data (Settings → Data → Server backups).' });
    if (!v) return;
    if (v === 'replace' && !(await LR.ui.confirm('Replace the whole register on the server with <b>' + U.esc(f.name) + '</b>?', { ok: 'Override', danger: true, detail: 'Everyone using the register will see the uploaded data. A backup of the present data is kept on the server.' }))) return;
    await S.flush();
    try {
      const j = await api('/api/data', { method: 'PUT', body: JSON.stringify({ baseRev: S.rev, data: incoming, by: S.me(), mode: v }) });
      S.rev = j.meta.rev; S.savedAt = j.meta.savedAt; S.savedBy = j.meta.savedBy;
      S.data = S.migrate(j.data); S.dirty = false; S.setStatus('ok');
      LR.app.render();
      LR.ui.toast(v === 'replace' ? 'The register was replaced with the uploaded file.' : 'The uploaded file was merged into the register.');
    } catch (err) { LR.ui.toast('Upload failed: ' + err.message, 'err'); }
  };

  S.loggedOut = () => {
    if (S.out) return; S.out = true;
    clearInterval(poller);
    LR.ui.toast('Your session has ended. Please log in again.', 'err');
    setTimeout(() => { location.href = '/'; }, 1600);
  };
  S.logout = async () => { clearInterval(poller); if (LR.demo) return; try { await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }); } catch (_) {} };
})();

/* js/rules.js */
/* js/rules.js — case helpers, limitation dates, and the preemptive action engine.
   LR.rules.actions() reads the whole register and returns what needs doing, most urgent first. */
(function () {
  'use strict';
  const LR = window.LR, U = LR.util, R = LR.refs;
  const M = LR.rules = {};
  const D = () => LR.store.data;
  const A = () => D().settings.alerts;

  M.caseNo = (c) => c ? ((c.caseType || '') + ' ' + (c.number || '?') + (c.year ? '/' + c.year : '')).trim() : '';
  M.court = (c) => (D().courts.find((x) => x.id === c.courtId)) || null;
  M.courtShort = (c) => { const ct = M.court(c); return ct ? ct.short || ct.name : (c.courtText || ''); };
  M.vs = (c) => (c.petitioner || '—') + ' vs ' + (c.respondents || '—');
  M.isOpen = (c) => c.status === 'Pending' || c.status === 'Reserved';
  M.counsel = (id) => D().counsel.find((x) => x.id === id) || null;
  M.caseById = (id) => D().cases.find((x) => x.id === id) || null;

  M.lastHearing = (c) => (c.hearings || []).slice().sort(U.by('date', -1))[0] || null;
  /** Add or edit a hearing; keep the case's next date in step with the latest hearing. */
  M.syncNext = (c) => {
    const last = M.lastHearing(c);
    if (!last) return;
    if (last.nextDate) { c.nextDate = last.nextDate; c.nextPurpose = last.nextPurpose || ''; }
    else if (c.nextDate && c.nextDate <= last.date) { c.nextDate = ''; c.nextPurpose = ''; }
  };

  /** Limitation for a remedy against an order. Returns { r, from, last, target, law }. */
  M.limitation = (c, o) => {
    const ct = M.court(c);
    const key = o.remedy || R.defaultRemedy(ct && ct.kind, c.bench);
    const r = R.REMEDIES[key] || R.REMEDIES.none;
    const base = r.from === 'copy' ? (o.copyOn || o.date) : o.date;
    if (!base) return { key, r, from: null, last: null };
    const last = r.days ? (key === 'arb-34' ? U.addMonths(base, 3) : U.addDays(base, r.days)) : null;
    const target = !r.days && key === 'writ-hc' ? U.addDays(base, A().writTarget || 90) : null;
    return { key, r, from: base, last, target, law: r.law };
  };
  M.adverse = (o) => /against/i.test(o.result || '');
  M.orderOpen = (o) => !['Complied', 'No action needed', 'Appeal / review filed'].includes(o.action);

  function sev(days, win) {
    if (days < 0) return 'over';
    if (days <= 2) return 'crit';
    if (days <= 7) return 'soon';
    if (days <= win) return 'up';
    return null;
  }
  M.SEV = { over: 'Overdue', crit: 'Within 2 days', soon: 'This week', up: 'Coming up', watch: 'Watch' };
  M.RANK = { over: 0, crit: 1, soon: 2, up: 3, watch: 4 };
  M.whenText = (days) => days == null ? '' : days < 0 ? Math.abs(days) + (Math.abs(days) === 1 ? ' day' : ' days') + ' overdue' : days === 0 ? 'Today' : days === 1 ? 'Tomorrow' : 'In ' + days + ' days';

  M.actions = (opts = {}) => {
    const d = D(), T = U.today(), al = A(), out = [];
    const push = (a) => {
      const st = d.actionState[a.key];
      if (st && st.done && !opts.all) return;
      if (st && st.snooze && st.snooze > T && !opts.all) return;
      a.days = a.due ? U.diff(T, a.due) : null;
      out.push(a);
    };
    for (const c of d.cases) {
      const no = M.caseNo(c), open = M.isOpen(c), base = { caseId: c.id, ref: no, court: M.courtShort(c), sample: c.sample };
      if (open) {
        // 1. hearings
        if (c.nextDate) {
          const n = U.diff(T, c.nextDate);
          const recorded = (c.hearings || []).some((h) => h.date >= c.nextDate);
          if (n < 0 && !recorded) {
            push(Object.assign({}, base, { key: 'upd:' + c.id + ':' + c.nextDate, kind: 'hearing', sev: 'over', due: c.nextDate,
              title: 'Record what happened on ' + U.fmt(c.nextDate) + ' and the next date', steps: ['Get the order sheet / daily order from counsel or the court website.', 'Add the hearing in the case and enter the next date of hearing.'] }));
          } else if (n >= 0) {
            const s = sev(n, al.hearing);
            if (s) {
              const steps = ['Check the cause list for the item number and court room.', 'Brief counsel and send the latest instructions and documents.', 'Name an officer to attend with the file.'];
              if (c.replyDue && !c.counterOn) steps.unshift('Counter / reply not yet filed — ask counsel to file it or seek time on this date.');
              if (c.contempt) steps.unshift('Contempt matter — keep the compliance affidavit ready; the officer may be asked to appear.');
              if (c.stay) steps.push('Interim order in force — ask counsel to seek its continuation.');
              push(Object.assign({}, base, { key: 'hear:' + c.id + ':' + c.nextDate, kind: 'hearing', sev: s, due: c.nextDate,
                title: (n === 0 ? 'Hearing today' : 'Hearing ' + U.rel(c.nextDate)) + (c.nextPurpose ? ' — ' + c.nextPurpose : ''), steps }));
            }
          }
        } else if (c.status === 'Pending') {
          push(Object.assign({}, base, { key: 'nodate:' + c.id + ':' + (M.lastHearing(c) || {}).date, kind: 'hearing', sev: 'watch', due: null,
            title: 'No next date of hearing recorded', steps: ['Check the court website / cause list or ask counsel.', 'Enter the next date in the case.'] }));
        }
        // 2. reply / counter
        if (c.replyDue && !c.counterOn) {
          const n = U.diff(T, c.replyDue), s = sev(n, al.reply);
          if (s) {
            const steps = [];
            if (!c.paraSentOn) steps.push('Send approved para-wise comments to counsel now (aim: 10 days before the due date).');
            steps.push('Get the draft counter from counsel, check it against records, and arrange the deponent.');
            if (n < 0) steps.push('Overdue — ask counsel to file at once or seek time; make sure the right to file is not closed.');
            push(Object.assign({}, base, { key: 'reply:' + c.id + ':' + c.replyDue, kind: 'reply', sev: s, due: c.replyDue, title: 'Counter / reply due ' + U.fmt(c.replyDue), steps }));
          }
        } else if (c.noticeOn && !c.paraSentOn && !c.counterOn && c.status === 'Pending') {
          const due = U.addDays(c.noticeOn, al.paraDays || 15), n = U.diff(T, due), s = sev(n, 7);
          if (s) push(Object.assign({}, base, { key: 'para:' + c.id, kind: 'reply', sev: s, due,
            title: 'Prepare para-wise comments (notice received ' + U.fmt(c.noticeOn) + ')', steps: ['Collect facts and records from ' + (c.section || 'the dealing section') + '.', 'Draft para-wise comments (format in Ready Reference) and get approval.'] }));
        }
        // 3. no counsel
        if (!c.counselId && c.imdRole !== 'Petitioner / Applicant' && c.caseType !== 'Arbitration') {
          push(Object.assign({}, base, { key: 'counsel:' + c.id, kind: 'counsel', sev: c.nextDate && U.diff(T, c.nextDate) <= 7 ? 'soon' : 'watch', due: c.nextDate || null,
            title: 'No Government counsel recorded for this case', steps: ['Find the CGSC / panel counsel for this bench and send the brief.', 'Enter the counsel in the case.'] }));
        }
        // 4. reserved too long
        if (c.status === 'Reserved' && c.reservedOn && U.diff(c.reservedOn, T) >= (al.reserved || 90)) {
          push(Object.assign({}, base, { key: 'resv:' + c.id + ':' + Math.floor(U.diff(c.reservedOn, T) / 30), kind: 'watch', sev: 'watch', due: null,
            title: 'Judgment reserved for ' + U.diff(c.reservedOn, T) + ' days', steps: ['Watch the pronouncement list; ask counsel to mention if the delay is long.'] }));
        }
        // 5. dormant
        const lh = M.lastHearing(c);
        const since = lh ? lh.date : c.filedOn;
        if (c.status === 'Pending' && since && U.diff(since, T) >= (al.dormant || 180) && (!c.nextDate || c.nextDate < T)) {
          push(Object.assign({}, base, { key: 'dorm:' + c.id + ':' + since, kind: 'watch', sev: 'watch', due: null,
            title: 'No hearing recorded for ' + U.diff(since, T) + ' days', steps: ['Check the case status online; it may have been listed or disposed.'] }));
        }
        // 6. contempt / stay watch
        if (c.contempt) push(Object.assign({}, base, { key: 'cp:' + c.id, kind: 'watch', sev: 'watch', due: null, title: 'Contempt proceedings pending', steps: ['Complete compliance first; file a compliance affidavit.', 'Keep the officer named in the petition informed.'] }));
        if (c.stay) push(Object.assign({}, base, { key: 'stay:' + c.id, kind: 'watch', sev: 'watch', due: null, title: 'Interim order in force', steps: [c.stayText || 'Follow the interim order and get it continued on every date.'] }));
      }
      // 7. orders: compliance and appeal limitation (open or disposed cases)
      for (const o of c.orders || []) {
        if (!M.orderOpen(o)) continue;
        if (o.complianceDue && o.direction) {
          const n = U.diff(T, o.complianceDue), s = sev(n, al.compliance);
          if (s) {
            const steps = n < 0
              ? ['Time for compliance is over — CONTEMPT RISK.', 'Comply at once, or file an application for extension of time / appeal with stay today.', 'Inform counsel and the competent authority.']
              : ['Decide now: comply, or challenge the order.', 'If challenging: file the appeal / review and seek a stay before ' + U.fmt(o.complianceDue) + '.', 'If more time is needed: file an application for extension of time before the due date.', 'Get the approval of the competent authority on file.'];
            push(Object.assign({}, base, { key: 'comp:' + c.id + ':' + o.id + ':' + o.complianceDue, kind: 'order', sev: s, due: o.complianceDue,
              title: 'Comply with order of ' + U.fmt(o.date) + ' by ' + U.fmt(o.complianceDue), note: o.direction, steps, orderId: o.id }));
          }
        }
        if (M.adverse(o) && o.kind !== 'Interim order' && o.action !== 'Comply') {
          const L = M.limitation(c, o);
          const due = L.last || L.target;
          if (due && L.key !== 'none') {
            const n = U.diff(T, due), s = sev(n, al.appeal);
            if (s) push(Object.assign({}, base, { key: 'appeal:' + c.id + ':' + o.id + ':' + due, kind: 'order', sev: s, due,
              title: (L.last ? 'Last date: ' : 'Target date: ') + L.r.label + ' — ' + U.fmt(due),
              note: L.law, orderId: o.id,
              steps: [ 'Obtain counsel’s opinion on the merits of ' + L.r.label.toLowerCase() + '.',
                'Send the proposal with the opinion to the competent authority / Ministry / DoLA — at least 30 days before the last date.',
                L.last ? 'Do not wait for the last day; delay beyond this date needs a condonation application.' : 'No fixed period — but delay can defeat the petition.' ] }));
          }
        }
      }
    }
    // 8. tasks (follow-ups)
    for (const t of d.tasks) {
      if (t.done || !t.due) continue;
      const n = U.diff(T, t.due), s = sev(n, 7);
      if (!s) continue;
      const c = t.caseId ? M.caseById(t.caseId) : null;
      push({ key: 'task:' + t.id + ':' + t.due, kind: 'task', sev: s, due: t.due, title: t.text, caseId: c ? c.id : null, ref: c ? M.caseNo(c) : 'Follow-up', court: c ? M.courtShort(c) : '', taskId: t.id, steps: t.who ? ['With: ' + t.who] : [], sample: t.sample });
    }
    // 9. notices
    for (const n0 of d.notices) {
      if (n0.status !== 'Open' || !n0.replyDue) continue;
      const n = U.diff(T, n0.replyDue), s = sev(n, al.reply);
      if (s) push({ key: 'notice:' + n0.id + ':' + n0.replyDue, kind: 'notice', sev: s, due: n0.replyDue, ref: n0.kind, court: n0.from, noticeId: n0.id, sample: n0.sample,
        title: 'Reply to ' + n0.kind.toLowerCase() + ' from ' + (n0.from || '—'), note: n0.subject,
        steps: ['Examine the claim with ' + (n0.office || 'the dealing office') + '; settle it if it is just.', 'Send a reasoned reply after vetting; keep proof of dispatch.'] });
    }
    // 10. advisory & vetting matters (LOA/MOU, RTI opinions, recruitment, administrative, DoLA)
    for (const m of d.matters || []) {
      if (R.MATTER_DONE.includes(m.status)) continue;
      const base = { matterId: m.id, ref: R.matterShort(m.type) + (m.ref ? ' · ' + m.ref : ''), court: m.region || m.fromOffice || '', sample: m.sample, kind: 'matter' };
      if (m.status === 'Referred to DoLA') {
        const since = m.dolaOn || m.receivedOn;
        if (since && U.diff(since, T) >= (al.dola || 30)) push(Object.assign({}, base, { key: 'dola:' + m.id + ':' + Math.floor(U.diff(since, T) / 15), sev: 'watch', due: null,
          title: 'No reply from DoLA for ' + U.diff(since, T) + ' days', note: m.subject, steps: ['Send a reminder quoting ' + (m.dolaRef || 'the reference number') + '.', 'If a court date depends on it, tell counsel to seek time.'] }));
        continue;
      }
      if (!m.dueOn) continue;
      const n = U.diff(T, m.dueOn), s0 = sev(n, al.matter || 3);
      if (!s0) continue;
      const steps = {
        'LOA / MOU vetting': ['Check parties, signatory powers, scope, payment, IPR / data, termination and dispute clauses (checklist in Ready Reference).', 'Return the vetted draft with changes marked.'],
        'RTI — legal opinion': ['The CPIO’s 30-day period is running — give the opinion today if possible.', 'Check s.8(1)(b) (court bar), s.8(1)(j), s.11 third-party procedure and s.10 severance.'],
        'Recruitment / extension': ['Check the Recruitment Rules / DoPT instructions and the competent authority.', 'Look for court orders on the same post or batch.'],
        'DoLA reference': ['Send a self-contained reference with documents and the last date.'],
      }[m.type] || ['Examine and give the opinion on file.'];
      if (m.status === 'Clarification sought') steps.unshift('Clarification asked from ' + (m.fromOffice || 'the office') + ' — remind them.');
      push(Object.assign({}, base, { key: 'mat:' + m.id + ':' + m.dueOn, sev: s0, due: m.dueOn, title: m.type + ' — opinion due', note: m.subject, steps }));
    }
    // 11. counsel panel term and fee bills
    for (const cn of d.counsel) {
      if (!cn.termTo) continue;
      const n = U.diff(T, cn.termTo), s = sev(n, al.panel || 60);
      if (s) push({ key: 'panel:' + cn.id + ':' + cn.termTo, kind: 'counsel', sev: s === 'up' ? 'watch' : s, due: cn.termTo, ref: cn.name, court: cn.type, counselId: cn.id, sample: cn.sample,
        title: 'Engagement of ' + cn.name + ' ends ' + U.fmt(cn.termTo), steps: ['Check with DoLA / the Ministry on renewal.', 'Arrange other counsel for the cases this counsel handles: ' + d.cases.filter((c) => c.counselId === cn.id && M.isOpen(c)).length + ' pending.'] });
    }
    for (const f of d.fees) {
      if (f.status === 'Paid' || f.status === 'Returned' || !f.billDate) continue;
      const age = U.diff(f.billDate, T);
      if (age >= (al.fees || 60)) {
        const cn = M.counsel(f.counselId);
        push({ key: 'fee:' + f.id, kind: 'fee', sev: 'watch', due: null, ref: 'Fee bill ' + (f.billNo || ''), court: cn ? cn.name : '', feeId: f.id, sample: f.sample,
          title: 'Counsel fee bill pending for ' + age + ' days — ' + U.money(f.amount), steps: ['Status: ' + f.status + '. Push it to the DDO / PAO for payment.'] });
      }
    }
    out.sort((a, b) => (M.RANK[a.sev] - M.RANK[b.sev]) || ((a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : 0));
    return out;
  };

    left() {

      const first = new Date(d0.getFullYear(), d0.getMonth(), 1), start = U.addDays(U.key(first), -((first.getDay() + 6) % 7));

          '<div class="hint">Each type gets a usual time for the opinion — vetting 7 days, RTI opinion 3 days (the CPIO’s 30 days are running), recruitment and administrative 10 days, DoLA 30 days. The Dashboard warns as the date comes near; a DoLA reference with no reply for 30 days is flagged for a reminder.</div>' +

        '<button class="btn" data-act="print-actions">' + I('print') + 'Action report</button>' +

        '<button class="btn" data-act="export-cases">' + I('download') + 'Cases (CSV for Excel)</button>' +
        '<button class="btn" data-act="export-hearings">' + I('download') + 'Hearings (CSV)</button>' +

    fields.push({ type: 'html', full: true, html: dataHtml });

  SET.backups = async () => {

    const m = UI.modal({ title: 'Server backups', width: 640,
      body: '<p class="small muted" style="margin-top:0">Copies the server made of the register file. <b>Restore</b> puts one back for everyone (the present data is backed up first).</p>' +
        (list.length ? '<table class="tbl"><tr><th>Backup</th><th>Size</th><th></th></tr>' + list.slice(0, 80).map((b) => '<tr><td>' + U.fmtTime(b.at) + '<div class="muted small">' + e(b.name) + '</div></td><td class="num">' + Math.max(1, Math.round(b.size / 1024)) + ' KB</td><td style="white-space:nowrap"><a class="btn sm" href="/api/backups/' + encodeURIComponent(b.name) + '">' + I('download') + '</a> <button class="btn sm" data-restore="' + e(b.name) + '">Restore</button></td></tr>').join('') + '</table>' : '<div class="empty">No backups yet — the first is made after the first hour of use.</div>'),
      foot: '<button class="btn" data-primary>Close</button>' });

    m.el.querySelectorAll('[data-restore]').forEach((b) => { b.onclick = async () => {
      if (!(await UI.confirm('Restore the backup <b>' + e(b.dataset.restore) + '</b> for everyone?', { ok: 'Restore', danger: true, detail: 'The present data is backed up first.' }))) return;
      await S.flush();
      try {
        const j = await S.api('/api/backups/' + encodeURIComponent(b.dataset.restore) + '/restore', { method: 'POST', body: JSON.stringify({ by: S.me() }) });
        S.rev = j.meta.rev; S.data = S.migrate(j.data); S.dirty = false; S.setStatus('ok');

  /* ---------------- search ---------------- */
  SET.search = () => {
    const m = UI.modal({ title: 'Look up by reference', width: 660, body: '<input class="field" id="sr-q" placeholder="Case no., file no., LOA / MOU no., party, region, counsel…" autofocus><div class="search-res" id="sr-r" style="margin-top:10px"></div>' });
    const q = m.el.querySelector('#sr-q'), out = m.el.querySelector('#sr-r');
    let hits = [], sel = 0;
    const run = () => {
      const t = q.value.trim();
      hits = LR.find(t, 40);
      for (const x of R.TIMELINES) if (t && U.norm([x.t, x.law, x.g].join(' ')).includes(U.norm(t))) hits.push({ kind: 'timeline', t: 'Timeline: ' + x.t, s: x.p + ' — ' + x.law, x });
      sel = 0;
      out.innerHTML = hits.map((h, i) => '<button data-i="' + i + '" class="' + (i === 0 ? 'on' : '') + '"><b>' + e(h.t) + '</b><span>' + e(h.s) + (h.tag ? ' · ' + e(h.tag) : '') + '</span></button>').join('') || (t ? '<div class="empty">Nothing found.</div>' : '<div class="small muted">Pick a result to see its complete picture.</div>');
    };
    const go = (h) => { m.close(); if (h.kind === 'timeline') { LR.app.state.tlQ = h.x.t; LR.app.go('reference', 'timelines'); } else LR.picture(h.kind, h.id); };
    q.oninput = run; run();
    q.onkeydown = (ev) => {
      if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { ev.preventDefault(); sel = Math.max(0, Math.min(hits.length - 1, sel + (ev.key === 'ArrowDown' ? 1 : -1))); out.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === sel)); }
      if (ev.key === 'Enter' && hits[sel]) go(hits[sel]);
    };

      '<table>' + [['Subject', (c.category || '') + ' — ' + (c.subject || '')], ['Relief', c.relief], ['Status / stage', c.status + ' / ' + (c.stage || '')], ['Next date', c.nextDate ? U.fmt(c.nextDate) + ' ' + (c.nextPurpose || '') : ''], ['Counsel', cn ? cn.name : ''], ['Office / officer', [c.office, c.section, c.nodal].filter(Boolean).join(' · ')], ['File no.', c.fileNo], ['Financial implication', U.money(c.amount)]].filter((r) => r[1]).map(([k, v]) => '<tr><th style="width:25%">' + k + '</th><td>' + e(v) + '</td></tr>').join('') + '</table>' +
      '<h2>Hearings</h2><table><tr><th>Date</th><th>Purpose</th><th>Proceedings</th><th>Next</th></tr>' + (c.hearings || []).slice().sort(U.by('date')).map((h) => '<tr><td>' + U.fmt(h.date) + '</td><td>' + e(h.purpose || '') + '</td><td>' + e(h.proceedings || '') + '</td><td>' + (h.nextDate ? U.fmt(h.nextDate) : '') + '</td></tr>').join('') + '</table>' +

/* js/picture.js */
/* js/picture.js — one reference → the complete picture.
   LR.find(q) searches every register by any reference (case no., file no., letter no., party, region);
   LR.picture(kind, id) shows everything about that one item on a single card. */
(function () {
  'use strict';
  const LR = window.LR, U = LR.util, M = LR.rules, R = LR.refs, e = U.esc, I = LR.icon, UI = LR.ui, S = LR.store;

  LR.find = (q, max) => {
    const t = U.norm(q).trim();
    if (!t) return [];
    const ws = t.replace(/[\/\-]/g, ' ').split(/\s+/).filter(Boolean);
    const ok = (s) => { const h = U.norm(s).replace(/[\/\-]/g, ' '); return ws.every((w) => h.includes(w)); };
    const out = [];
    for (const c of S.data.cases) if (ok([M.caseNo(c), c.number, c.petitioner, c.respondents, c.subject, c.category, c.fileNo, c.region, c.office, c.linked, c.limbs, c.dolaRef, M.courtShort(c)].join(' ')))
      out.push({ kind: 'case', id: c.id, t: M.caseNo(c) + ' · ' + M.courtShort(c), s: M.vs(c), tag: c.status, open: M.isOpen(c) });
    for (const m of S.data.matters) if (ok([m.type, m.ref, m.subject, m.party, m.region, m.fromOffice, m.dolaRef].join(' ')))
      out.push({ kind: 'matter', id: m.id, t: m.type + (m.ref ? ' · ' + m.ref : ''), s: m.subject || '', tag: m.status, open: !R.MATTER_DONE.includes(m.status) });
    for (const n of S.data.notices) if (ok([n.kind, n.from, n.subject, n.advocate, n.region, n.replyRef].join(' ')))
      out.push({ kind: 'notice', id: n.id, t: n.kind + ' · ' + (n.from || ''), s: n.subject || '', tag: n.status, open: n.status === 'Open' });
    for (const c of S.data.counsel) if (ok([c.name, c.type, c.courts].join(' ')))
      out.push({ kind: 'counsel', id: c.id, t: c.name, s: (c.type || '') + ' · ' + (c.courts || ''), tag: 'Counsel', open: true });
    out.sort((a, b) => b.open - a.open);
    return max ? out.slice(0, max) : out;
  };

  const row = (k, v) => v ? '<div class="k">' + k + '</div><div>' + v + '</div>' : '';
  const dateLine = (label, k, done) => k ? '<li><b>' + label + ':</b> ' + U.fmt(k, true) + (done ? ' <span class="badge b-done">done</span>' : ' <span class="badge ' + (U.fromToday(k) < 0 ? 'b-over' : U.fromToday(k) <= 7 ? 'b-soon' : 'b-up') + '">' + M.whenText(U.fromToday(k)) + '</span>') + '</li>' : '';

  function caseCard(c) {
    const ct = M.court(c), cn = M.counsel(c.counselId), acts = M.actions().filter((a) => a.caseId === c.id && a.sev !== 'watch');
    const watch = M.actions().filter((a) => a.caseId === c.id && a.sev === 'watch');
    const hs = (c.hearings || []).slice().sort(U.by('date', -1)).slice(0, 3);
    const os = (c.orders || []).slice().sort(U.by('date', -1));
    const matters = S.data.matters.filter((m) => m.caseId === c.id), notices = S.data.notices.filter((n) => n.caseId === c.id), tasks = S.data.tasks.filter((t) => t.caseId === c.id && !t.done);
    let dates = '';
    if (M.isOpen(c)) dates += dateLine('Next hearing' + (c.nextPurpose ? ' (' + e(c.nextPurpose) + ')' : ''), c.nextDate);
    if (c.replyDue) dates += dateLine('Counter / reply', c.replyDue, !!c.counterOn);
    for (const o of os) {
      if (o.complianceDue && o.direction) dates += dateLine('Comply with order of ' + U.fmt(o.date), o.complianceDue, !M.orderOpen(o));
      if (M.adverse(o) && o.kind !== 'Interim order' && M.orderOpen(o) && o.action !== 'Comply') { const L = M.limitation(c, o); if (L.last || L.target) dates += dateLine((L.last ? 'Last date: ' : 'Target: ') + e(L.r.label), L.last || L.target); }
    }
    return '<div class="case-head"><div style="min-width:0"><div class="no">' + e(M.caseNo(c)) + '</div><div class="court">' + e(ct ? ct.name : '') + (c.bench ? ' · ' + e(c.bench) : '') + '</div>' +
      '<div class="vs">' + e(c.petitioner || '—') + '<em>versus</em>' + e(c.respondents || '—') + '</div></div>' +
      '<div class="st">' + (M.isOpen(c) ? '<span class="badge b-up">' + e(c.status) + '</span>' : '<span class="stamp" style="--c:' + (/against/i.test(c.result || '') ? 'var(--over)' : 'var(--done)') + '">' + e(c.status) + '</span>') + '</div></div>' +
      '<div class="chips">' + [c.region && '<span class="badge">' + e(c.region) + '</span>', c.category && '<span class="badge">' + e(c.category) + '</span>', c.contempt && '<span class="badge b-over">Contempt</span>', c.stay && '<span class="badge b-up">Interim order</span>', c.dola && '<span class="badge b-watch">DoLA</span>', c.priority === 'high' && '<span class="badge b-acc">High priority</span>'].filter(Boolean).join('') + '</div>' +
      (acts.length ? '<h3 class="sec">What needs doing</h3>' + acts.map((a) => '<div class="acard ' + a.sev + '" style="padding:8px 10px"><div class="top"><div class="tt">' + e(a.title) + '</div><div class="due">' + '<span class="badge b-' + a.sev + '">' + e(a.due ? M.whenText(a.days) : M.SEV[a.sev]) + '</span></div></div>' + (a.steps && a.steps.length ? '<ul>' + a.steps.slice(0, 3).map((s) => '<li>' + e(s) + '</li>').join('') + '</ul>' : '') + '</div>').join('') : '<div class="hint">Nothing pressing on this case.</div>') +
      (dates ? '<h3 class="sec">Key dates</h3><ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.9">' + dates + '</ul>' : '') +
      '<h3 class="sec">The case</h3><div class="sheet">' + row('Subject', U.nl(c.subject || '')) + row('Relief sought', U.nl(c.relief || '')) + row('Stage', e(c.stage || '') + (c.result ? ' · ' + e(c.result) : '')) +
      row('Region / office', e([...new Set([c.region, c.office, c.section].filter(Boolean))].join(' · '))) + row('Officer-in-charge', e(c.nodal || '')) +
      row('Government counsel', cn ? e(cn.name) + (cn.phone ? ' · ' + e(cn.phone) : '') : '<span style="color:var(--over)">not recorded</span>') +
      row('Interim order', c.stay ? e(c.stayText || 'In force') : '') + row('DoLA', c.dola ? e(c.dolaRef || 'involved') : '') +
      row('Financial implication', c.amount ? U.money(c.amount) : '') + row('e-Office file', e(c.fileNo || '')) + row('Connected', e(c.linked || '')) + '</div>' +
      (hs.length ? '<h3 class="sec">Latest hearings</h3>' + hs.map((h) => '<div class="small" style="padding:5px 0;border-bottom:1px solid var(--rule)"><b>' + U.fmt(h.date) + '</b>' + (h.purpose ? ' · ' + e(h.purpose) : '') + ' — ' + e(h.proceedings || '') + '</div>').join('') : '') +
      (os.length ? '<h3 class="sec">Orders</h3>' + os.map((o) => '<div class="small" style="padding:5px 0;border-bottom:1px solid var(--rule)"><b>' + U.fmt(o.date) + '</b> · ' + e(o.kind || '') + (o.result ? ' · ' + e(o.result) : '') + (o.direction ? '<div>Direction: ' + e(o.direction) + '</div>' : '') + (o.action ? '<div class="muted">Action: ' + e(o.action) + '</div>' : '') + '</div>').join('') : '') +
      (matters.length || notices.length || tasks.length ? '<h3 class="sec">Linked</h3>' + matters.map((m) => '<div class="small">' + e(m.type) + ' — ' + e(m.subject) + ' (' + e(m.status) + ')</div>').join('') + notices.map((n) => '<div class="small">' + e(n.kind) + ' from ' + e(n.from) + '</div>').join('') + tasks.map((t) => '<div class="small">Follow-up: ' + e(t.text) + (t.due ? ' — by ' + U.fmt(t.due) : '') + '</div>').join('') : '') +
      (watch.length ? '<h3 class="sec">Keep an eye on</h3>' + watch.map((a) => '<div class="small">• ' + e(a.title) + '</div>').join('') : '');
  }
  function matterCard(m) {
    const acts = M.actions().filter((a) => a.matterId === m.id);
    const c = m.caseId && M.caseById(m.caseId);
    return '<div class="case-head"><div><div class="no">' + e(m.type) + '</div><div class="court">' + e(m.ref || '') + '</div><div class="vs" style="font-size:15px">' + e(m.subject || '') + '</div></div><div class="st"><span class="badge ' + (R.MATTER_DONE.includes(m.status) ? 'b-done' : 'b-up') + '">' + e(m.status) + '</span></div></div>' +

      row('Reply due', n.replyDue ? U.fmt(n.replyDue) + (n.status === 'Open' ? ' (' + U.rel(n.replyDue) + ')' : '') : '') + row('Replied', n.repliedOn ? U.fmt(n.repliedOn) : '') + row('Notes', U.nl(n.notes || '')) + '</div>';

  function summaryText(kind, x) {
    if (kind === 'case') {
      const lines = [M.caseNo(x) + ' — ' + (M.court(x) || {}).name, M.vs(x), 'Subject: ' + (x.subject || ''), 'Region: ' + (x.region || '') + (x.office ? ' / ' + x.office : ''), 'Status: ' + x.status + ' — ' + (x.stage || '')];

    m.el.querySelector('[data-copy]').onclick = () => LR.app.copy(summaryText(kind, x));
    const pr = m.el.querySelector('[data-print]'); if (pr) pr.onclick = () => LR.settings.printCase(x);
    m.el.querySelector('[data-primary]').onclick = () => { m.close(); LR.app.act({ case: 'open-case', matter: 'open-matter', notice: 'open-notice' }[kind], { id }); };

      if (!fn) return;
      ev.preventDefault();
      fn(Object.assign({}, el.dataset), el, ev);
    });

      const el = ev.target.closest('[data-change]');
      if (!el || el.closest('.modal')) return;

      if (!fn) return;
      const isText = el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search' || !el.type);
      if ((ev.type === 'input') !== isText) return;
      fn(el.value, el);
    };

    document.addEventListener('change', onCh);

      const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); SET.search(); return; }
      if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); A['sync-now'](); return; }
      if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      if (ev.key === '/') { ev.preventDefault(); SET.search(); }
      else if (/^[1-8]$/.test(ev.key)) app.go(TABS[+ev.key - 1]);

    const s = (S.data && S.data.settings) || LR.sample.settings();
    return '<div class="cover">' + LR.emblem('emb') +
      '<div class="hi">' + e(s.orgHindi || '') + '</div><div class="en">' + e(s.orgName || '') + '</div><div class="rule"></div>' +
      '<h1>Legal Register</h1><div class="sub">' + e(s.section || '') + (s.sectionHindi ? ' · ' + e(s.sectionHindi) : '') + '<br>Cases, Hearings, Orders &amp; Ready Reference</div>' +
      (opts.button ? '<button class="open-btn" id="cover-btn">' + e(opts.button) + '</button>' : '') + (opts.note ? '<div class="note">' + opts.note + '</div>' : '') +
      '<div class="yr">' + e(s.ministry || '') + '</div></div>';
  }
  function showCover() {
    return new Promise((resolve) => {
      const w = document.createElement('div');
      w.className = 'cover-wrap';
      w.innerHTML = coverHtml({ button: 'Open the register', note: LR.demo ? 'Demo copy with example entries. The installed register first asks for the login (legal / legal_imd).' : 'Press Enter to open' });
      document.body.appendChild(w);
      const open = () => {
        document.removeEventListener('keydown', key);
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { w.remove(); resolve(); return; }
        w.classList.add('opening'); setTimeout(() => { w.remove(); resolve(); }, 900);
      };
      const key = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); } };
      document.addEventListener('keydown', key);
      w.querySelector('#cover-btn').onclick = open;
      w.querySelector('#cover-btn').focus();
    });
  }

  async function closeBook() {
    const s = S.data.settings;
    const ok = await UI.confirm('Close the register and log out?', { ok: 'Close the register', detail: s.autoDownload ? 'A copy of the whole register (JSON) will be downloaded to this computer. The register itself stays saved on the server.' : 'The register stays saved on the server.' });
    if (!ok) return;
    const saved = await S.flush();
    closing = true;
    let name = '';
    if (s.autoDownload) name = S.download(true);
    await S.logout();
    const w = document.createElement('div');
    w.className = 'cover-wrap';
    w.innerHTML = coverHtml({ button: 'Log in again', note: (saved ? 'The register is closed and saved on the server.' : '<b>Some changes could not reach the server.</b> They are in the downloaded copy — upload it when the server is back.') + (name ? '<br>A copy was downloaded as <b>' + e(name) + '</b>.' : '') });
    document.body.appendChild(w);
    document.getElementById('app').innerHTML = '';
    w.querySelector('#cover-btn').onclick = () => { if (LR.demo) location.reload(); else location.href = '/'; };
  }

  /* ---------------- start ---------------- */
  async function start() {
    try { const lk = JSON.parse(localStorage.getItem('imdlr-look') || 'null'); if (lk) { document.documentElement.dataset.look = lk.look; document.documentElement.dataset.dark = lk.dark; } } catch (_) {}
    try {
      await S.init();
    } catch (err) {
      if (S.out) return;
      document.getElementById('app').innerHTML = '<div class="cover-wrap">' + coverHtml({ button: 'Try again', note: 'The register could not be loaded: ' + e(err.message) }) + '</div>';
      document.getElementById('cover-btn').onclick = () => location.reload();
      return;
    }
    SET.applyLook();
    state.calDay = U.today();
    app.renderShell();
    bind();
    app.render();
    if (S.data.settings.cover !== false) await showCover();
    if (S.recovered) UI.toast('Changes from your last visit that had not reached the server were merged in and saved.');
  }
  start();
})();

</script>
